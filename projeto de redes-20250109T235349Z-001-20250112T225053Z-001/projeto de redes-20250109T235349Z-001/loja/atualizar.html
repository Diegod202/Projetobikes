<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atualizar Bicicleta</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>

    <div class="container">
        <h1>Atualizar Bicicleta</h1>

        <a href="/index.html">Voltar para a página inicial</a>

        <form action="http://localhost:8000/bikes/{bike_id}" method="POST">
            <label for="bike_id">ID da Bicicleta:</label>
            <input type="number" id="bike_id" name="bike_id" required>

            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required>

            <label for="brand">Marca:</label>
            <input type="text" id="brand" name="brand" required>

            <label for="price">Preço:</label>
            <input type="number" step="0.01" id="price" name="price" required>

            <label for="type">Tipo:</label>
            <input type="text" id="type" name="type" required>

            <label for="description">Descrição:</label>
            <textarea id="description" name="description" required></textarea>

            <button type="submit">Atualizar Bicicleta</button>
        </form>
    </div>

</body>
</html>
