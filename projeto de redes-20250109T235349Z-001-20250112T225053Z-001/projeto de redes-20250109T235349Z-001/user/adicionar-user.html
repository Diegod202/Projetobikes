<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar User</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/exibirDadosUsuario.js" defer></script>
</head>
<body>

    <div class="container">
        <h1>Adicionar Novo User</h1>
        
        <a href="/index.html">Voltar para a página inicial</a>

        <form id="adicionarUsuarioForm" action="http://localhost:8000/usuarios" method="POST">
            <label for="name">Nome:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="text" id="email" name="email" required>

            <label for="telefone">Telefone:</label>
            <input type="number" step="0.01" id="telefone" name="telefone" required>

            <button type="submit">Adicionar User</button>
        </form>

        <h2>Dados Inseridos:</h2>
        <div id="resultadoUsuario"></div>
    </div>

</body>
</html>
